<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>Smart Student ID - ADLINKCARD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #1F3A5F; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #E7EEF6; }
  #wait {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 2;
    font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    transition: opacity .3s;
  }
  #wait.gone { opacity: 0; pointer-events: none; }
  .dot { display: inline-block; width: 10px; height: 10px; margin: 0 4px; border-radius: 50%;
         background: #fff; animation: b 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes b { to { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<div id="wait"><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
<iframe id="app" title="Smart Student ID" allow="clipboard-write"></iframe>
<script>
  /* =========================================================
     ADLINKCARD - Smart Student ID wrapper (hides the Google banner)
     Your Apps Script web app link (ends with /exec):
     ========================================================= */
  var APP_LINK = "https://script.google.com/macros/s/AKfycbxI-XisTa9d8UY4gV1rHXut54_jsljCxwH_ylc97LeRwhkHtrW9h-s5_aTS-5--4WFF/exec";

  // ?id=CP0001&key=... (photo) and ?m=CP0001&k=... (medical) are passed on
  var f = document.getElementById("app");
  f.src = APP_LINK + location.search;
  f.onload = function () { document.getElementById("wait").className = "gone"; };

  // The medical page sits inside frames, and phones block calls, location and new pages
  // started from inside frames. So the medical page asks THIS page to do them.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || typeof d !== "object") return;
    if (!/(^https:\/\/script\.google\.com$)|(\.googleusercontent\.com$)/.test(e.origin)) return;   // only Google's page
    var reply = function (m) { try { e.source.postMessage(m, "*"); } catch (x) {} };

    // 1. Call parent
    if (typeof d.adlCall === "string" && /^tel:\+?\d{6,15}$/.test(d.adlCall)) {
      reply({ adlCallOk: true });
      window.location.href = d.adlCall;
    }

    // 2. Lost? Scan me: location (only after the finder tapped the button; the phone asks first)
    if (d.adlLocate === true) {
      reply({ adlLocAck: true });
      if (!navigator.geolocation) { reply({ adlLocErr: "failed" }); return; }
      navigator.geolocation.getCurrentPosition(function (p) {
        reply({ adlLoc: { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy } });
      }, function (err) {
        reply({ adlLocErr: err && err.code === 1 ? "denied" : "failed" });
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    }

    // 3. Send the location on WhatsApp (WhatsApp links only)
    if (typeof d.adlOpen === "string" && /^https:\/\/wa\.me\/\d{6,15}\?text=/.test(d.adlOpen)) {
      reply({ adlOpenOk: true });
      if (!window.open(d.adlOpen, "_blank")) window.location.href = d.adlOpen;
    }
  });
</script>
</body>
</html>
